<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sección III & IV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/seccion3-4.css">
</head>
<body class="container my-5">
    <a href="../index.html" class="btn btn-secondary mb-4">Volver al Menú</a>

    <!-- Sección III: Arreglo de 10 países con sort() -->
    <section class="mt-4">
        <h2 class="mb-3">Sección III: Arreglo de Países con .sort()</h2>
        <p>Gestiona y ordena alfabéticamente el arreglo de 10 países utilizando el método <code>sort()</code>.</p>
        
        <div class="row mb-3">
            <div class="col-md-6 mb-2">
                <div class="input-group">
                    <input type="text" id="nuevoPais" class="form-control" placeholder="Agregar otro país...">
                    <button class="btn btn-success" type="button" onclick="agregarPais()">Agregar</button>
                </div>
            </div>
            <div class="col-md-6">
                <button class="btn btn-warning fw-bold text-dark w-100" onclick="ordenarPaises()">Ordenar Países (.sort)</button>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <h5>Lista Actual:</h5>
                <ul id="listaOriginal" class="list-group"></ul>
            </div>
            <div class="col-md-6">
                <h5>Lista Ordenada alfabéticamente:</h5>
                <ul id="listaPaises" class="list-group"></ul>
            </div>
        </div>
    </section>

        <hr class="border-secondary">

     <!-- Sección IV: Menú desplegable y formulario de login -->
    <section class="mb-5">
        <h2 class="mb-3">Sección IV: Formulario Desplegable</h2>
        <div class="menu-icon" onclick="toggleLogin()">&#9776; Menú</div>
        <div id="loginForm" class="login-box rounded">
            <h5 class="text-white mb-3">Iniciar Sesión</h5>
            <div class="mb-2">
                <label class="form-label">Correo Electrónico:</label>
                <input type="email" class="form-control" id="emailInput" placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña:</label>
                <input type="password" class="form-control" id="passInput" placeholder="********">
            </div>
            <button class="btn w-100" onclick="simularLogin()">Ingresar</button>
            <p id="resLogin" class="mt-2 text-warning fw-bold small"></p>
        </div>
    </section>

    <script src="../js/seccion3-4.js"></script>
</body>
</html>
