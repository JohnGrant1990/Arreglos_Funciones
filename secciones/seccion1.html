<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sección I</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/seccion1.css">
</head>
<body class="container my-5">
    <a href="/index.html" class="btn btn-secondary mb-4">Volver al Menú</a>
    <h1 class="mb-4">Ejercicios: If-else y Case</h1>

    <div class="row g-4">
        <!-- 1. Votación -->
        <div class="col-md-6">
            <div class="card p-3 h-100">
                <h3>1. Votación por Zonas</h3>
                <label class="form-label">Selecciona tu sección:</label>
                <select id="selectZona" class="form-select mb-2">
                    <option value="norte">Norte</option>
                    <option value="sur">Sur</option>
                    <option value="centro">Centro</option>
                </select>
                <button class="btn btn-success" onclick="votarZonas()">Emitir Voto</button>
                <p id="resVoto" class="fw-bold mt-2"></p>
            </div>
        </div>

        <!-- 2. Suma Positivos -->
        <div class="col-md-6">
            <div class="card p-3 h-100">
                <h3>2. Suma de Positivos</h3>
                <p">Ingresa números positivos uno a uno. Introduce 0 o negativo para finalizar.</p>
                <div class="input-group mb-2">
                    <input type="number" id="inputPositivo" class="form-control" placeholder="Número">
                    <button class="btn btn-outline-light" type="button" onclick="agregarNumero()">Agregar</button>
                </div>
                <button class="btn btn-success w-100" onclick="finalizarSuma()">Finalizar y Ver Suma</button>
                <p id="resSuma" class="fw-bold mt-2">Suma acumulada: 0</p>
            </div>
        </div>

        <!-- 3. Ordenar 3 números -->
        <div class="col-md-6">
            <div class="card p-3 h-100">
                <h3>3. Ordenar 3 Números</h3>
                <div class="row g-2 mb-2">
                    <div class="col"><input type="number" id="num1" class="form-control" placeholder="Núm 1"></div>
                    <div class="col"><input type="number" id="num2" class="form-control" placeholder="Núm 2"></div>
                    <div class="col"><input type="number" id="num3" class="form-control" placeholder="Núm 3"></div>
                </div>
                <button class="btn btn-success" onclick="ordenarNumeros()">Ordenar de Mayor a Menor</button>
                <p id="resOrden" class="fw-bold mt-2"></p>
            </div>
        </div>

        <!-- 4. Importe Neto -->
        <div class="col-md-6">
            <div class="card p-3 h-100">
                <h3>4. Cálculo de Importe Neto</h3>
                <label class="form-label">Importe Bruto:</label>
                <input type="number" id="inputBruto" class="form-control mb-2" placeholder="Ej. 18000">
                <button class="btn btn-success" onclick="calcularImporte()">Calcular Neto</button>
                <p id="resImporte" class="fw-bold mt-2"></p>
            </div>
        </div>

        <!-- 5. Sueldo por Antigüedad -->
        <div class="col-md-12">
            <div class="card p-3">
                <h3>5. Sueldo por Antigüedad (Base: 40,000€)</h3>
                <label class="form-label">Años de antigüedad en la empresa:</label>
                <input type="number" id="inputAnos" class="form-control mb-2" placeholder="Ej. 6">
                <button class="btn btn-success" onclick="calcularSueldo()">Calcular Sueldo Total</button>
                <p id="resSueldo" class="fw-bold mt-2"></p>
            </div>
        </div>
    </div>

    <script src="/js/seccion1.js"></script>
</body>
</html>
